<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>店舗監査カメラ</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: sans-serif; background: #111; color: #fff; overflow: hidden; }

    #app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      /* JSで --app-h をセットする */
      height: calc(var(--app-h, 100vh));
      overflow: hidden;
    }

    /* カメラ */
    #camera-container {
      flex: 1;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      min-height: 0;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 設定エリア */
    #config-container {
      padding: 8px;
      background: #222;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }
    input {
      flex: 1;
      padding: 8px;
      font-size: 16px; /* 16px未満だとiOSが自動ズームするので必ず16px以上 */
      border-radius: 4px;
      border: none;
    }
    #sync-btn {
      white-space: nowrap;
      padding: 8px 14px;
      background: #0096ff;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      font-size: 14px;
    }

    /* カテゴリボタン */
    #category-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
      padding: 5px;
      background: #151515;
      flex-shrink: 0;
    }
    .cat-btn {
      padding: 13px 4px;
      font-size: 15px;
      background: #333;
      color: #fff;
      border: 2px solid transparent;
      border-radius: 8px;
      font-weight: bold;
    }
    .cat-btn.active {
      background: #00ff7f;
      color: #000;
      border-color: #fff;
    }

    /* シャッターボタン */
    #shutter-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 6px;
      background: #000;
      flex-shrink: 0;
      height: 18dvh;
      min-height: 80px;
    }
    .shutter-btn {
      font-size: 26px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      width: 100%;
      height: 100%;
    }
    .btn-o { background: #34c759; color: #fff; }
    .btn-x { background: #ff3b30; color: #fff; }
    .btn-p { background: #ffcc00; color: #000; }

    .flash { animation: flash-animation 0.2s ease-out; }
    @keyframes flash-animation {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    /* ===============================
       横向き（Landscape）レイアウト
    =============================== */
    @media (orientation: landscape) {
      #app {
        flex-direction: row;
      }

      #camera-container {
        flex: 1;
        height: 100%;
      }

      #side-panel {
        display: flex;
        flex-direction: column;
        width: 30vw;
        min-width: 200px;
        max-width: 320px;
        background: #111;
        height: 100%;
        overflow: hidden;
        flex-shrink: 0;
      }

      #config-container {
        flex-direction: column;
        align-items: stretch;
        gap: 5px;
        padding: 8px;
      }
      #config-container input { width: 100%; font-size: 15px; padding: 10px 8px; }
      #sync-btn { width: 100%; text-align: center; padding: 10px; font-size: 15px; }

      #category-container {
        grid-template-columns: repeat(2, 1fr);
        flex: 1;
        gap: 5px;
        padding: 6px;
        align-content: stretch;
      }
      .cat-btn {
        padding: 0;
        font-size: 14px;
        height: 100%;
      }

      #shutter-container {
        grid-template-columns: 1fr;
        gap: 6px;
        padding: 8px;
        height: auto;
        min-height: unset;
        flex-shrink: 0;
      }
      .shutter-btn {
        font-size: 26px;
        padding: 14px 0;
        height: auto;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="camera-container">
      <video id="video" autoplay playsinline></video>
      <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <div id="side-panel">
      <div id="config-container">
        <input type="text" id="store-name" placeholder="店舗名 (例: 渋谷店)">
        <button id="sync-btn" onclick="syncData()">送信 (<span id="local-count">0</span>)</button>
      </div>

      <div id="category-container">
        <button class="cat-btn active" onclick="selectCategory(this, '労務管理')">労務管理</button>
        <button class="cat-btn" onclick="selectCategory(this, '安全衛生')">安全衛生</button>
        <button class="cat-btn" onclick="selectCategory(this, '基本項目')">基本項目</button>
        <button class="cat-btn" onclick="selectCategory(this, '事務金銭')">事務金銭</button>
        <button class="cat-btn" onclick="selectCategory(this, '組織開発')">組織開発</button>
        <button class="cat-btn" onclick="selectCategory(this, 'クレンリネス')">クレンリネス</button>
      </div>

      <div id="shutter-container">
        <button class="shutter-btn btn-o" onclick="takeSnapshot('〇')">〇</button>
        <button class="shutter-btn btn-x" onclick="takeSnapshot('×')">×</button>
        <button class="shutter-btn btn-p" onclick="takeSnapshot('▲')">▲</button>
      </div>
    </div>
  </div>

  <script>
    // iOSの回転バグ対策：実際の表示領域をCSS変数にセット
    function setAppHeight() {
      document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
    }
    setAppHeight();
    window.addEventListener('resize', () => {
      setTimeout(setAppHeight, 100);
    });
    window.addEventListener('orientationchange', () => {
      setTimeout(setAppHeight, 300);
    });

    // WebAudio APIでシャッター音を生成（カメラのシャッター音に近い短いクリック音）
    let audioCtx = null;
    function playShutterSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        // 高周波の短いバースト音でシャッターっぽく
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.1);
      } catch(e) {}
    }

    let currentCategory = '労務管理';
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const storeInput = document.getElementById('store-name');

    if (localStorage.getItem('saved_store_name')) {
      storeInput.value = localStorage.getItem('saved_store_name');
    }
    storeInput.addEventListener('input', () => {
      localStorage.setItem('saved_store_name', storeInput.value);
    });

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } },
      audio: false
    }).then(stream => { video.srcObject = stream; })
      .catch(() => { alert("カメラの起動に失敗しました。設定を確認してください。"); });

    function selectCategory(element, name) {
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      currentCategory = name;
    }

    function takeSnapshot(judgement) {
      const storeName = storeInput.value.trim();
      if (!storeName) { alert("最初に店舗名を入力してください。"); return; }

      video.classList.add('flash');
      setTimeout(() => video.classList.remove('flash'), 200);
      playShutterSound();

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = canvas.toDataURL('image/jpeg', 0.8);

      let localData = JSON.parse(localStorage.getItem('audit_photos') || '[]');
      localData.push({ storeName, category: currentCategory, judgement, image: imageData, timestamp: Date.now() });
      localStorage.setItem('audit_photos', JSON.stringify(localData));
      updateLocalCount();
    }

    function updateLocalCount() {
      const localData = JSON.parse(localStorage.getItem('audit_photos') || '[]');
      document.getElementById('local-count').innerText = localData.length;
    }

    let isSyncing = false;
    function syncData() {
      if (isSyncing) return;
      let localData = JSON.parse(localStorage.getItem('audit_photos') || '[]');
      if (localData.length === 0) { alert("送信する写真はありません。"); return; }
      if (!confirm(`未送信の写真が ${localData.length} 件あります。Googleドライブへ送信しますか？\n(電波の良い場所で行ってください)`)) return;

      isSyncing = true;
      const syncBtn = document.getElementById('sync-btn');
      syncBtn.innerText = "送信中...";
      syncBtn.style.background = "#555";

      function sendNext() {
        let currentData = JSON.parse(localStorage.getItem('audit_photos') || '[]');
        if (currentData.length === 0) {
          isSyncing = false;
          syncBtn.innerText = "送信 (0)";
          syncBtn.style.background = "#0096ff";
          alert("すべての写真のアップロードが完了しました！");
          return;
        }
        google.script.run
          .withSuccessHandler(() => {
            currentData.shift();
            localStorage.setItem('audit_photos', JSON.stringify(currentData));
            updateLocalCount();
            sendNext();
          })
          .withFailureHandler(() => {
            isSyncing = false;
            const remaining = JSON.parse(localStorage.getItem('audit_photos') || '[]').length;
            syncBtn.innerText = `エラー再開 (${remaining})`;
            syncBtn.style.background = "#ff3b30";
            alert("送信中にエラーが発生しました。電波の良い場所で再度お試しください。");
          })
          .uploadPhoto(currentData[0]);
      }
      sendNext();
    }

    updateLocalCount();
  </script>
</body>
</html>
