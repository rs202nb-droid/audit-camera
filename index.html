<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>店舗監査カメラ</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: sans-serif; background: #111; color: #fff; overflow: hidden; }

    #app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: var(--app-h, 100vh);
      overflow: hidden;
    }

    /* カメラ */
    #camera-container {
      flex: 1;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      min-height: 0;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 設定エリア */
    #config-container {
      padding: 8px;
      background: #222;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }
    input {
      flex: 1;
      padding: 8px;
      font-size: 16px; /* 16px未満だとiOSが自動ズームするので必ず16px以上 */
      border-radius: 4px;
      border: none;
    }
    #sync-btn {
      white-space: nowrap;
      padding: 8px 14px;
      background: #0096ff;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      font-size: 14px;
    }

    /* カテゴリボタン */
    #category-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
      padding: 5px;
      background: #151515;
      flex-shrink: 0;
    }
    .cat-btn {
      padding: 13px 4px;
      font-size: 15px;
      background: #333;
      color: #fff;
      border: 2px solid transparent;
      border-radius: 8px;
      font-weight: bold;
    }
    .cat-btn.active {
      background: #00ff7f;
      color: #000;
      border-color: #fff;
    }

    /* シャッターボタン（縦向き） */
    #shutter-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 6px;
      background: #000;
      flex-shrink: 0;
      height: 18dvh;
      min-height: 80px;
    }
    .shutter-btn {
      font-size: 26px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      width: 100%;
      height: 100%;
    }
    .btn-o { background: #34c759; color: #fff; }
    .btn-x { background: #ff3b30; color: #fff; }
    .btn-p { background: #ffcc00; color: #000; }

    .flash { animation: flash-animation 0.2s ease-out; }
    @keyframes flash-animation {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    /* ===============================
       横向き（Landscape）レイアウト
    =============================== */
    @media (orientation: landscape) {
      #app {
        flex-direction: row;
        height: var(--app-h, 100vh);
      }

      #camera-container {
        flex: 1;
        height: var(--app-h, 100vh);
      }

      /* サイドパネル：高さをJSの計算値で固定 */
      #side-panel {
        display: flex;
        flex-direction: column;
        width: 30vw;
        min-width: 190px;
        max-width: 300px;
        background: #111;
        height: var(--app-h, 100vh);
        overflow: hidden;
        flex-shrink: 0;
      }

      #config-container {
        flex-direction: column;
        align-items: stretch;
        gap: 5px;
        padding: 8px;
        flex-shrink: 0;
      }
      #config-container input { width: 100%; font-size: 16px; padding: 9px 8px; }
      #sync-btn { width: 100%; text-align: center; padding: 10px; font-size: 15px; }

      /* カテゴリは残り領域を伸び縮みで使う */
      #category-container {
        grid-template-columns: repeat(2, 1fr);
        flex: 1;
        gap: 5px;
        padding: 6px;
        min-height: 0;
        align-content: stretch;
      }
      .cat-btn {
        padding: 0;
        font-size: 14px;
        height: 100%;
      }

      /* シャッターは高さを --app-h の33%に固定して必ず画面内に収める */
      #shutter-container {
        grid-template-columns: 1fr;
        gap: 5px;
        padding: 8px;
        flex-shrink: 0;
        height: calc(var(--app-h, 100vh) * 0.33);
        min-height: 110px;
      }
      .shutter-btn {
        font-size: 24px;
        padding: 0;
        height: 100%;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="camera-container">
      <video id="video" autoplay playsinline></video>
      <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <div id="side-panel">
      <div id="config-container">
        <input type="text" id="store-name" placeholder="店舗名 (例: 渋谷店)">
        <button id="sync-btn" onclick="syncData()">送信 (<span id="local-count">0</span>)</button>
      </div>

      <div id="category-container">
        <button class="cat-btn active" onclick="selectCategory(this, '労務管理')">労務管理</button>
        <button class="cat-btn" onclick="selectCategory(this, '安全衛生')">安全衛生</button>
        <button class="cat-btn" onclick="selectCategory(this, '基本項目')">基本項目</button>
        <button class="cat-btn" onclick="selectCategory(this, '事務金銭')">事務金銭</button>
        <button class="cat-btn" onclick="selectCategory(this, '組織開発')">組織開発</button>
        <button class="cat-btn" onclick="selectCategory(this, 'クレンリネス')">クレンリネス</button>
      </div>

      <div id="shutter-container">
        <button class="shutter-btn btn-o" onclick="takeSnapshot('〇')">〇</button>
        <button class="shutter-btn btn-x" onclick="takeSnapshot('×')">×</button>
        <button class="shutter-btn btn-p" onclick="takeSnapshot('▲')">▲</button>
      </div>
    </div>
  </div>

  <script>
    // iOSのSafariアドレスバーを除いた実際の高さをCSS変数にセット
    function setAppHeight() {
      document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
    }
    setAppHeight();
    window.addEventListener('resize', () => { setTimeout(setAppHeight, 100); });
    window.addEventListener('orientationchange', () => { setTimeout(setAppHeight, 300); });

    // WebAudio APIでシャッター音を生成
    let audioCtx = null;
    function playShutterSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.1);
      } catch(e) {}
    }

    let currentCategory = '労務管理';
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const storeInput = document.getElementById('store-name');

    if (localStorage.getItem('saved_store_name')) {
      storeInput.value = localStorage.getItem('saved_store_name');
    }
    storeInput.addEventListener('input', () => {
      localStorage.setItem('saved_store_name', storeInput.value);
    });

    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { min: 1280, ideal: 1920 },
        height: { min: 720, ideal: 1080 }
      },
      audio: false
    }).then(stream => { video.srcObject = stream; })
      .catch(() => { alert("カメラの起動に失敗しました。設定を確認してください。"); });

    function selectCategory(element, name) {
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      currentCategory = name;
    }

    function takeSnapshot(judgement) {
      const storeName = storeInput.value.trim();
      if (!storeName) { alert("最初に店舗名を入力してください。"); return; }

      video.classList.add('flash');
      setTimeout(() => video.classList.remove('flash'), 200);
      playShutterSound();

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = canvas.toDataURL('image/jpeg', 0.8);

      let localData = JSON.parse(localStorage.getItem('audit_photos') || '[]');
      localData.push({ storeName, category: currentCategory, judgement, image: imageData, timestamp: Date.now() });
      localStorage.setItem('audit_photos', JSON.stringify(localData));
      updateLocalCount();
      autoSync(); // 撮影と同時にバックグラウンド送信開始
    }

    // GAS WebアプリのURL
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzzm1rsYowVX0rFUb5JItn4UIhfv9rl2I_8b-aN1LnSGGREmDVREF1VXboZ77WqXCou/exec';

    function updateLocalCount() {
      const count = JSON.parse(localStorage.getItem('audit_photos') || '[]').length;
      const syncBtn = document.getElementById('sync-btn');
      if (count === 0) {
        syncBtn.innerText = "✓ 同期済み";
        syncBtn.style.background = "#28a745";
      } else {
        syncBtn.innerText = `送信待ち ${count}件`;
        syncBtn.style.background = "#ff9500";
      }
    }

    const sleep = ms => new Promise(r => setTimeout(r, ms));

    // バックグラウンド自動送信（no-corsモード・撮影UIをブロックしない）
    let isSyncing = false;
    async function autoSync() {
      if (isSyncing) return;
      isSyncing = true;

      while (true) {
        let currentData = JSON.parse(localStorage.getItem('audit_photos') || '[]');
        if (currentData.length === 0) break;

        try {
          await fetch(GAS_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify(currentData[0])
          });
          // no-corsはレスポンス読めないのでGASの処理完了を待ってから削除
          await sleep(4000);
          currentData = JSON.parse(localStorage.getItem('audit_photos') || '[]');
          currentData.shift();
          localStorage.setItem('audit_photos', JSON.stringify(currentData));
          updateLocalCount();
        } catch (e) {
          // 電波が悪い場合は30秒後にリトライ
          isSyncing = false;
          setTimeout(autoSync, 30000);
          return;
        }
      }

      isSyncing = false;
    }

    // 送信ボタンは手動トリガー（兼ステータス表示）
    function syncData() {
      autoSync();
    }

    // 起動時に件数表示＆未送信があれば即送信開始
    updateLocalCount();
    autoSync();
  </script>
</body>
</html>
