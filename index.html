<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>店舗監査カメラ</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #111; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    /* カメラエリア（上半分） */
    #camera-container { relative; width: 100%; height: 45vh; background: #000; display: flex; justify-content: center; align-items: center; }
    video { width: 100%; height: 100%; object-fit: cover; }
    /* 設定エリア（中央） */
    #config-container { padding: 10px; background: #222; display: flex; gap: 10px; align-items: center; }
    input { flex: 1; padding: 8px; font-size: 16px; border-radius: 4px; border: none; }
    #sync-btn { padding: 8px 15px; background: #0096ff; color: #fff; border: none; border-radius: 4px; font-weight: bold; font-size: 14px; }
    /* カテゴリボタン（中下段） */
    #category-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 5px; background: #151515; }
    .cat-btn { padding: 12px 5px; font-size: 14px; background: #333; color: #fff; border: 2px solid transparent; border-radius: 6px; font-weight: bold; }
    .cat-btn.active { background: #00ff7f; color: #000; border-color: #fff; }
    /* シャッターボタン（最下段） */
    #shutter-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px; background: #000; height: 15vh; }
    .shutter-btn { font-size: 28px; font-weight: bold; border: none; border-radius: 12px; color: #fff; color: #000; }
    .btn-o { background: #34c759; color: #fff; } /* 緑 */
    .btn-x { background: #ff3b30; color: #fff; } /* 赤 */
    .btn-p { background: #ffcc00; color: #000; } /* 黄▲ */
    /* シャッターが押された瞬間のフラッシュ効果 */
    .flash { animation: flash-animation 0.2s ease-out; }
    @keyframes flash-animation { 0% { opacity: 0.3; } 100% { opacity: 1; } }
  </style>
</head>
<body>

  <div id="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none;"></canvas>
  </div>

  <div id="config-container">
    <input type="text" id="store-name" placeholder="店舗名を入力 (例: 渋谷店)">
    <button id="sync-btn" onclick="syncData()">送信 (<span id="local-count">0</span>)</button>
  </div>

  <div id="category-container">
    <button class="cat-btn active" onclick="selectCategory(this, '労務管理')">労務管理</button>
    <button class="cat-btn" onclick="selectCategory(this, '安全衛生')">安全衛生</button>
    <button class="cat-btn" onclick="selectCategory(this, '基本項目')">基本項目</button>
    <button class="cat-btn" onclick="selectCategory(this, '事務金銭')">事務金銭</button>
    <button class="cat-btn" onclick="selectCategory(this, '組織開発')">組織開発</button>
    <button class="cat-btn" onclick="selectCategory(this, 'クレンリネス')">クレンリネス</button>
  </div>

  <div id="shutter-container">
    <button class="shutter-btn btn-o" onclick="takeSnapshot('〇')">〇</button>
    <button class="shutter-btn btn-x" onclick="takeSnapshot('×')">×</button>
    <button class="shutter-btn btn-p" onclick="takeSnapshot('▲')">▲</button>
  </div>

  <script>
    let currentCategory = '労務管理';
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const storeInput = document.getElementById('store-name');

    // 起動時に前回の店舗名を復元
    if(localStorage.getItem('saved_store_name')) {
      storeInput.value = localStorage.getItem('saved_store_name');
    }
    storeInput.addEventListener('input', () => {
      localStorage.setItem('saved_store_name', storeInput.value);
    });

    // シャッター音をWeb Audio APIで生成
    function playShutterSound() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();

      // ① 高音の「カシャ」成分（ノイズ）
      const bufferSize = ctx.sampleRate * 0.08;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1);

      const noise = ctx.createBufferSource();
      noise.buffer = buffer;

      const noiseFilter = ctx.createBiquadFilter();
      noiseFilter.type = 'bandpass';
      noiseFilter.frequency.value = 3500;
      noiseFilter.Q.value = 0.8;

      const noiseGain = ctx.createGain();
      noiseGain.gain.setValueAtTime(0.6, ctx.currentTime);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);

      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(ctx.destination);
      noise.start();

      // ② 低音の「カッ」成分（トーン）
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(200, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.06);

      const oscGain = ctx.createGain();
      oscGain.gain.setValueAtTime(0.5, ctx.currentTime);
      oscGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);

      osc.connect(oscGain);
      oscGain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.06);
    }

    // スマホのカメラを起動（外カメラ優先）
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } },
      audio: false
    }).then(stream => { video.srcObject = stream; })
      .catch(err => { alert("カメラの起動に失敗しました。設定を確認してください。"); });

    // カテゴリ選択
    function selectCategory(element, name) {
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      currentCategory = name;
    }

    // ★大本命：〇×▲が押されたら「即撮影・即スマホ内保存」
    function takeSnapshot(judgement) {
      const storeName = storeInput.value.trim();
      if (!storeName) { alert("最初に店舗名を入力してください。"); return; }

      // シャッター音を鳴らす
      playShutterSound();

      // 画面を一瞬フラッシュさせて撮った感を出します
      video.classList.add('flash');
      setTimeout(() => video.classList.remove('flash'), 200);

      // ビデオ映像を写真として切り取る
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = canvas.toDataURL('image/jpeg', 0.8); // 容量を抑えるため少し圧縮

      // 撮影データを作成
      const newData = {
        storeName: storeName,
        category: currentCategory,
        judgement: judgement,
        image: imageData,
        timestamp: new Date().getTime()
      };

      // スマホの中（LocalStorage）に安全に保存
      let localData = JSON.parse(localStorage.getItem('audit_photos') || '[]');
      localData.push(newData);
      localStorage.setItem('audit_photos', JSON.stringify(localData));

      updateLocalCount();
    }

    // 未送信の件数を更新
    function updateLocalCount() {
      let localData = JSON.parse(localStorage.getItem('audit_photos') || '[]');
      document.getElementById('local-count').innerText = localData.length;
    }

    // 電波が良い場所でGoogleドライブへ一括送信する
    let isSyncing = false;
    function syncData() {
      if (isSyncing) return;
      let localData = JSON.parse(localStorage.getItem('audit_photos') || '[]');
      if (localData.length === 0) { alert("送信する写真はありません。"); return; }

      if (!confirm(`未送信の写真が ${localData.length} 件あります。Googleドライブへ送信しますか？\n(電波の良い場所で行ってください)`)) return;

      isSyncing = true;
      const syncBtn = document.getElementById('sync-btn');
      syncBtn.innerText = "送信中...";
      syncBtn.style.background = "#555";

      function sendNext() {
        let currentData = JSON.parse(localStorage.getItem('audit_photos') || '[]');
        if (currentData.length === 0) {
          isSyncing = false;
          syncBtn.innerText = "送信 (0)";
          syncBtn.style.background = "#0096ff";
          alert("すべての写真のアップロードが完了しました！");
          return;
        }

        // 先頭の1件を送信
        const itemToSend = currentData[0];
        google.script.run
          .withSuccessHandler(() => {
            // 送信成功したらスマホ内から削除して次へ
            currentData.shift();
            localStorage.setItem('audit_photos', JSON.stringify(currentData));
            updateLocalCount();
            sendNext();
          })
          .withFailureHandler((err) => {
            isSyncing = false;
            syncBtn.innerText = `エラー再開 (${currentData.length})`;
            syncBtn.style.background = "#ff3b30";
            alert("送信中にエラーが発生しました。電波の良い場所で再度お試しください。");
          })
          .uploadPhoto(itemToSend);
      }

      sendNext();
    }

    // 起動時に件数を表示
    updateLocalCount();
  </script>
</body>
</html>
