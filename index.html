<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>店舗監査カメラ</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: sans-serif; background: #111; color: #fff; overflow: hidden; }

    #app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: var(--app-h, 100vh);
      overflow: hidden;
    }

    /* カメラ */
    #camera-container {
      flex: 1;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      min-height: 0;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 設定エリア */
    #config-container {
      padding: 8px;
      background: #222;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }
    input {
      flex: 1;
      padding: 8px;
      font-size: 16px; /* 16px未満だとiOSが自動ズームするので必ず16px以上 */
      border-radius: 4px;
      border: none;
    }
    #sync-btn {
      white-space: nowrap;
      padding: 8px 14px;
      background: #0096ff;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      font-size: 14px;
    }

    /* カテゴリボタン */
    #category-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
      padding: 5px;
      background: #151515;
      flex-shrink: 0;
    }
    .cat-btn {
      padding: 13px 4px;
      font-size: 15px;
      background: #333;
      color: #fff;
      border: 2px solid transparent;
      border-radius: 8px;
      font-weight: bold;
    }
    .cat-btn.active {
      background: #00ff7f;
      color: #000;
      border-color: #fff;
    }

    /* シャッターボタン（縦向き） */
    #shutter-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 6px;
      background: #000;
      flex-shrink: 0;
      height: 18dvh;
      min-height: 80px;
    }
    .shutter-btn {
      font-size: 26px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      width: 100%;
      height: 100%;
    }
    .btn-o { background: #34c759; color: #fff; }
    .btn-x { background: #ff3b30; color: #fff; }
    .btn-p { background: #ffcc00; color: #000; }

    .flash { animation: flash-animation 0.2s ease-out; }
    @keyframes flash-animation {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    /* ===============================
       横向き（Landscape）レイアウト
    =============================== */
    @media (orientation: landscape) {
      #app {
        flex-direction: row;
        height: var(--app-h, 100vh);
      }

      #camera-container {
        flex: 1;
        height: var(--app-h, 100vh);
      }

      /* サイドパネル：高さをJSの計算値で固定 */
      #side-panel {
        display: flex;
        flex-direction: column;
        width: 30vw;
        min-width: 190px;
        max-width: 300px;
        background: #111;
        height: var(--app-h, 100vh);
        overflow: hidden;
        flex-shrink: 0;
      }

      #config-container {
        flex-direction: column;
        align-items: stretch;
        gap: 5px;
        padding: 8px;
        flex-shrink: 0;
      }
      #config-container input { width: 100%; font-size: 16px; padding: 9px 8px; }
      #sync-btn { width: 100%; text-align: center; padding: 10px; font-size: 15px; }

      /* カテゴリは残り領域を伸び縮みで使う */
      #category-container {
        grid-template-columns: repeat(2, 1fr);
        flex: 1;
        gap: 5px;
        padding: 6px;
        min-height: 0;
        align-content: stretch;
      }
      .cat-btn {
        padding: 0;
        font-size: 14px;
        height: 100%;
      }

      /* シャッターは高さを --app-h の33%に固定して必ず画面内に収める */
      #shutter-container {
        grid-template-columns: 1fr;
        gap: 5px;
        padding: 8px;
        flex-shrink: 0;
        height: calc(var(--app-h, 100vh) * 0.33);
        min-height: 110px;
      }
      .shutter-btn {
        font-size: 24px;
        padding: 0;
        height: 100%;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="camera-container">
      <video id="video" autoplay playsinline></video>
      <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <div id="side-panel">
      <div id="config-container">
        <input type="text" id="store-name" placeholder="店舗名 (例: 渋谷店)">
        <button id="sync-btn" onclick="syncData()">送信 (<span id="local-count">0</span>)</button>
      </div>

      <div id="category-container">
        <button class="cat-btn active" onclick="selectCategory(this, '労務管理')">労務管理</button>
        <button class="cat-btn" onclick="selectCategory(this, '安全衛生')">安全衛生</button>
        <button class="cat-btn" onclick="selectCategory(this, '基本項目')">基本項目</button>
        <button class="cat-btn" onclick="selectCategory(this, '事務金銭')">事務金銭</button>
        <button class="cat-btn" onclick="selectCategory(this, '組織開発')">組織開発</button>
        <button class="cat-btn" onclick="selectCategory(this, 'クレンリネス')">クレンリネス</button>
      </div>

      <div id="shutter-container">
        <button class="shutter-btn btn-o" onclick="takeSnapshot('〇')">〇</button>
        <button class="shutter-btn btn-x" onclick="takeSnapshot('×')">×</button>
        <button class="shutter-btn btn-p" onclick="takeSnapshot('▲')">▲</button>
      </div>
    </div>
  </div>

  <script>
    // iOSのSafariアドレスバーを除いた実際の高さをCSS変数にセット
    function setAppHeight() {
      document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
    }
    setAppHeight();
    window.addEventListener('resize', () => { setTimeout(setAppHeight, 100); });
    window.addEventListener('orientationchange', () => { setTimeout(setAppHeight, 300); });

    // WebAudio APIでシャッター音を生成
    let audioCtx = null;
    function playShutterSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.1);
      } catch(e) {}
    }

    let currentCategory = '労務管理';
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const storeInput = document.getElementById('store-name');

    if (localStorage.getItem('saved_store_name')) {
      storeInput.value = localStorage.getItem('saved_store_name');
    }
    storeInput.addEventListener('input', () => {
      localStorage.setItem('saved_store_name', storeInput.value);
    });

    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { min: 1280, ideal: 3840 },
        height: { min: 720, ideal: 2160 },
        focusMode: { ideal: "continuous" }
      },
      audio: false
    }).then(stream => {
      video.srcObject = stream;
      // 対応端末なら明示的に継続オートフォーカスを要求(非対応環境では無視される)
      const [track] = stream.getVideoTracks();
      const capabilities = track.getCapabilities ? track.getCapabilities() : {};
      if (capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
        track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
      }
    }).catch(() => { alert("カメラの起動に失敗しました。設定を確認してください。"); });

    function selectCategory(element, name) {
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      currentCategory = name;
    }

    // ===============================
    // 写真保存キュー(IndexedDB)
    // localStorageは5〜10MB程度しか入らず、4K/高画質の写真が数枚溜まると
    // 容量オーバーで例外→撮影が黙って失われる事故が起きたため移行。
    // IndexedDBは数百MB〜GB単位まで扱えるので同じ問題が起きにくい。
    // ===============================
    const DB_NAME = 'audit_camera_db';
    const STORE_NAME = 'photos';
    let dbPromise = null;

    function openDB() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      return dbPromise;
    }

    async function addPhoto(photo) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).add(photo);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function getOldestPhoto() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).openCursor();
        req.onsuccess = () => resolve(req.result ? req.result.value : null);
        req.onerror = () => reject(req.error);
      });
    }

    async function deletePhoto(id) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function getPhotoCount() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).count();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    // 旧localStorage方式で溜まったまま送れていない写真があれば救出して移行
    async function migrateFromLocalStorage() {
      const raw = localStorage.getItem('audit_photos');
      if (!raw) return;
      try {
        const oldData = JSON.parse(raw);
        for (const photo of oldData) {
          await addPhoto(photo);
        }
      } catch (e) {}
      localStorage.removeItem('audit_photos');
    }

    async function takeSnapshot(judgement) {
      const storeName = storeInput.value.trim();
      if (!storeName) { alert("最初に店舗名を入力してください。"); return; }

      // カメラ準備前に押されると真っ黒な空画像が保存されてしまうため、
      // 映像サイズが取得できているか(=起動完了しているか)を確認する
      if (!video.videoWidth || !video.videoHeight) {
        alert("カメラの準備がまだ完了していません。数秒待ってからもう一度撮影してください。");
        return;
      }

      video.classList.add('flash');
      setTimeout(() => video.classList.remove('flash'), 200);
      playShutterSound();

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = canvas.toDataURL('image/jpeg', 0.95);

      try {
        await addPhoto({ storeName, category: currentCategory, judgement, image: imageData, timestamp: Date.now() });
      } catch (e) {
        alert("画像の保存に失敗しました。お手数ですがもう一度撮影してください。\n" + e.message);
        return;
      }
      await updateLocalCount();
      autoSync(); // 撮影と同時にバックグラウンド送信開始
    }

    // GAS WebアプリのURL
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzzm1rsYowVX0rFUb5JItn4UIhfv9rl2I_8b-aN1LnSGGREmDVREF1VXboZ77WqXCou/exec';

    // 合言葉(トークン)。GAS側と同じ文字列にする。素のURLを叩くだけの不正投入を弾く簡易対策。
    // ※フロントのソースに書くため完全な秘密ではない（詳しくはGAS側コメント参照）
    const AUTH_TOKEN = 'audit-cam-Xk9f2Qd7mL4pRt8w-2026';

    async function updateLocalCount() {
      const count = await getPhotoCount();
      const syncBtn = document.getElementById('sync-btn');
      if (count === 0) {
        syncBtn.innerText = "✓ 同期済み";
        syncBtn.style.background = "#28a745";
      } else {
        syncBtn.innerText = `送信待ち ${count}件`;
        syncBtn.style.background = "#ff9500";
      }
    }

    // バックグラウンド自動送信（GASの成功応答を確認してから削除・撮影UIをブロックしない）
    let isSyncing = false;
    async function autoSync() {
      if (isSyncing) return;
      isSyncing = true;

      while (true) {
        const photo = await getOldestPhoto();
        if (!photo) break;

        try {
          // 電波が弱いと通信が固まって永久に待ち続けることがあるため、
          // 20秒で打ち切って(abort)リトライに回す
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 20000);
          let res;
          try {
            // no-corsをやめ、GASの返事({result:'success'})を読む。
            // Content-Typeを付けない(=text/plainの簡易リクエスト)ことでCORSプリフライトを避ける
            res = await fetch(GAS_URL, {
              method: 'POST',
              body: JSON.stringify({ ...photo, token: AUTH_TOKEN }),
              signal: controller.signal
            });
          } finally {
            clearTimeout(timer);
          }
          const json = await res.json();
          if (json.result === 'success') {
            // GASが「保存できた」と確認できた時だけ削除する（証拠写真の消失防止）
            await deletePhoto(photo.id);
            await updateLocalCount();
          } else {
            // GAS側で保存に失敗。写真は消さずにリトライへ回す
            throw new Error(json.message || 'サーバー側で保存に失敗しました');
          }
        } catch (e) {
          // 電波が悪い場合は30秒後にリトライ
          isSyncing = false;
          setTimeout(autoSync, 30000);
          return;
        }
      }

      isSyncing = false;
    }

    // 送信ボタンは手動トリガー（兼ステータス表示）
    function syncData() {
      autoSync();
    }

    // 起動時に旧データを救出→件数表示→未送信があれば送信開始
    // （救出が終わってから1回だけautoSyncを呼ぶ。以前は末尾でも呼んでいて二重だった）
    migrateFromLocalStorage().then(() => {
      updateLocalCount();
      autoSync();
    });
  </script>
</body>
</html>
